syntax = "proto3";

option csharp_namespace = "Rappix.Merchants.Api.Grpc";

package merchants.v1;

// Servicio interno para que otros microservicios (Orders, Catalog) validen comercios sin HTTP.
service MerchantValidationService {
  // Indica si un merchant esta activo (visible y operativo).
  rpc IsMerchantActive (MerchantIdRequest) returns (IsMerchantActiveResponse);

  // Devuelve datos basicos de un merchant.
  rpc GetMerchantBasicInfo (MerchantIdRequest) returns (MerchantBasicInfoResponse);
}

message MerchantIdRequest {
  string merchant_id = 1;
}

message IsMerchantActiveResponse {
  bool is_active = 1;
  string status = 2;
}

message MerchantBasicInfoResponse {
  bool found = 1;
  bool is_active = 2;
  string name = 3;
  string slug = 4;
  string vertical_type = 5;
  // Usuario (Identity) propietario del comercio. Lo consume Orders para autorizar accept/reject del dueño.
  string owner_user_id = 6;
  // Ubicacion fisica del comercio (de donde recoge el courier). Lo consume Orders para incluirlo en
  // CourierRequestedIntegrationEvent y que Dispatch (Fase 6) haga matching geo de couriers.
  // has_pickup_location=false significa que el owner aun no la fijo (PUT /merchants/me/pickup-location).
  double pickup_latitude = 7;
  double pickup_longitude = 8;
  bool has_pickup_location = 9;
}
