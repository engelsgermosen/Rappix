name: rappix

services:
  # ──────────────────────────────────────────────────────────────
  # Base de datos relacional con extensión geoespacial
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:17-3.5
    container_name: rappix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rappix
      POSTGRES_PASSWORD: rappix_dev_2026
      POSTGRES_DB: rappix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rappix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rappix-net

  # ──────────────────────────────────────────────────────────────
  # Cache, geo-search, SignalR backplane
  # ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rappix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass rappix_redis_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rappix_redis_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rappix-net

  # ──────────────────────────────────────────────────────────────
  # Broker de mensajería para MassTransit
  # ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rappix-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rappix
      RABBITMQ_DEFAULT_PASS: rappix_mq_2026
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - rappix-net

  # ──────────────────────────────────────────────────────────────
  # Logging centralizado estructurado
  # ──────────────────────────────────────────────────────────────
  seq:
    image: datalust/seq:2024.3
    container_name: rappix-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - rappix-net

  # ──────────────────────────────────────────────────────────────
  # Object storage S3-compatible para imágenes, comprobantes, etc.
  # ──────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: rappix-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rappix
      MINIO_ROOT_PASSWORD: rappix_minio_2026
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rappix-net

  # ──────────────────────────────────────────────────────────────
  # Identity Service (Fase 1). Los secretos se inyectan desde .env.
  # ──────────────────────────────────────────────────────────────
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Rappix.Identity.Api/Dockerfile
    container_name: rappix-identity
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      # Conexiones por nombre de servicio dentro de la red de Docker.
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=rappix_identity;Username=rappix;Password=rappix_dev_2026"
      ConnectionStrings__Redis: "redis:6379,password=rappix_redis_2026"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: rappix
      RabbitMq__Password: rappix_mq_2026
      Seq__ServerUrl: "http://seq:80"
      Jwt__Issuer: "https://localhost:5001"
      Jwt__Audience: rappix
      Jwt__AccessTokenLifetimeMinutes: "15"
      Jwt__RefreshTokenLifetimeDays: "90"
      # Secretos: definir en .env (ver .env.example).
      Jwt__SigningKey: "${IDENTITY_JWT_SIGNINGKEY:?Define IDENTITY_JWT_SIGNINGKEY en .env}"
      SendGrid__ApiKey: "${SENDGRID_API_KEY:-}"
      SendGrid__FromEmail: "${SENDGRID_FROM_EMAIL:-noreply@rappix.local}"
      SendGrid__FromName: "${SENDGRID_FROM_NAME:-Rappix}"
      Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      Google__CallbackPath: /signin-google
      App__PublicBaseUrl: "https://localhost:5001"
      App__FrontendUrl: "http://localhost:3000"
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - rappix-net

  # ──────────────────────────────────────────────────────────────
  # Merchants Service (Fase 2). REST en 8080, gRPC h2c en 8081.
  # ──────────────────────────────────────────────────────────────
  merchants-api:
    build:
      context: .
      dockerfile: src/Services/Merchants/Rappix.Merchants.Api/Dockerfile
    container_name: rappix-merchants
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # No se define ASPNETCORE_URLS: los dos puertos (8080 REST, 8081 gRPC) van en codigo (ConfigureKestrel).
      ConnectionStrings__MerchantsDb: "Host=postgres;Port=5432;Database=rappix_merchants;Username=rappix;Password=rappix_dev_2026"
      ConnectionStrings__Redis: "redis:6379,password=rappix_redis_2026"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: rappix
      RabbitMq__Password: rappix_mq_2026
      Seq__ServerUrl: "http://seq:80"
      Jwt__Issuer: "https://localhost:5001"
      Jwt__Audience: rappix
      # Misma clave que Identity: Merchants solo valida los tokens que Identity emite.
      Jwt__SigningKey: "${IDENTITY_JWT_SIGNINGKEY:?Define IDENTITY_JWT_SIGNINGKEY en .env}"
      # MinIO: las subidas usan el host interno; las URLs firmadas, el host publico (alcanzable desde el navegador).
      Minio__Endpoint: "minio:9000"
      Minio__PublicEndpoint: "localhost:9000"
      Minio__AccessKey: rappix
      Minio__SecretKey: rappix_minio_2026
      Minio__Bucket: merchants-logos
      Minio__UseSsl: "false"
    ports:
      - "5002:8080" # REST
      - "5012:8081" # gRPC (h2c)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - rappix-net

  # ──────────────────────────────────────────────────────────────
  # Catalog Service (Fase 3). REST en 8080, gRPC h2c en 8081.
  # Consume eventos de Merchants y le habla por gRPC (Grpc__MerchantsUrl).
  # ──────────────────────────────────────────────────────────────
  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/Rappix.Catalog.Api/Dockerfile
    container_name: rappix-catalog
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # No se define ASPNETCORE_URLS: los dos puertos (8080 REST, 8081 gRPC) van en codigo (ConfigureKestrel).
      ConnectionStrings__CatalogDb: "Host=postgres;Port=5432;Database=rappix_catalog;Username=rappix;Password=rappix_dev_2026"
      ConnectionStrings__Redis: "redis:6379,password=rappix_redis_2026"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: rappix
      RabbitMq__Password: rappix_mq_2026
      Seq__ServerUrl: "http://seq:80"
      Jwt__Issuer: "https://localhost:5001"
      Jwt__Audience: rappix
      # Misma clave que Identity: Catalog solo valida los tokens que Identity emite.
      Jwt__SigningKey: "${IDENTITY_JWT_SIGNINGKEY:?Define IDENTITY_JWT_SIGNINGKEY en .env}"
      # Cliente gRPC al servicio Merchants (validacion de comercio) por nombre de servicio en la red.
      Grpc__MerchantsUrl: "http://merchants-api:8081"
      # MinIO: las subidas usan el host interno; las URLs firmadas, el host publico (alcanzable desde el navegador).
      Minio__Endpoint: "minio:9000"
      Minio__PublicEndpoint: "localhost:9000"
      Minio__AccessKey: rappix
      Minio__SecretKey: rappix_minio_2026
      Minio__Bucket: catalog-items
      Minio__UseSsl: "false"
    ports:
      - "5003:8080" # REST
      - "5013:8081" # gRPC (h2c)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
      minio:
        condition: service_healthy
      merchants-api:
        condition: service_started
    networks:
      - rappix-net

  # ──────────────────────────────────────────────────────────────
  # Pricing Service (Fase 4). REST en 8080, gRPC h2c en 8081.
  # Cotiza pedidos: precios por gRPC a Catalog, validacion por gRPC a Merchants.
  # ──────────────────────────────────────────────────────────────
  pricing-api:
    build:
      context: .
      dockerfile: src/Services/Pricing/Rappix.Pricing.Api/Dockerfile
    container_name: rappix-pricing
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # No se define ASPNETCORE_URLS: los dos puertos (8080 REST, 8081 gRPC) van en codigo (ConfigureKestrel).
      ConnectionStrings__PricingDb: "Host=postgres;Port=5432;Database=rappix_pricing;Username=rappix;Password=rappix_dev_2026"
      ConnectionStrings__Redis: "redis:6379,password=rappix_redis_2026"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: rappix
      RabbitMq__Password: rappix_mq_2026
      Seq__ServerUrl: "http://seq:80"
      Jwt__Issuer: "https://localhost:5001"
      Jwt__Audience: rappix
      # Misma clave que Identity: Pricing solo valida los tokens que Identity emite.
      Jwt__SigningKey: "${IDENTITY_JWT_SIGNINGKEY:?Define IDENTITY_JWT_SIGNINGKEY en .env}"
      # Clientes gRPC por nombre de servicio en la red de Docker.
      Grpc__CatalogUrl: "http://catalog-api:8081"
      Grpc__MerchantsUrl: "http://merchants-api:8081"
    ports:
      - "5004:8080" # REST
      - "5014:8081" # gRPC (h2c)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
      catalog-api:
        condition: service_started
      merchants-api:
        condition: service_started
    networks:
      - rappix-net

  orders-api:
    build:
      context: .
      dockerfile: src/Services/Orders/Rappix.Orders.Api/Dockerfile
    container_name: rappix-orders
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # No se define ASPNETCORE_URLS: los dos puertos (8080 REST, 8081 HTTP/2) van en codigo (ConfigureKestrel).
      ConnectionStrings__OrdersDb: "Host=postgres;Port=5432;Database=rappix_orders;Username=rappix;Password=rappix_dev_2026"
      ConnectionStrings__Redis: "redis:6379,password=rappix_redis_2026"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: rappix
      RabbitMq__Password: rappix_mq_2026
      Seq__ServerUrl: "http://seq:80"
      Jwt__Issuer: "https://localhost:5001"
      Jwt__Audience: rappix
      # Misma clave que Identity: Orders solo valida los tokens que Identity emite.
      Jwt__SigningKey: "${IDENTITY_JWT_SIGNINGKEY:?Define IDENTITY_JWT_SIGNINGKEY en .env}"
      # Clientes gRPC por nombre de servicio en la red de Docker.
      Grpc__PricingUrl: "http://pricing-api:8081"
      Grpc__CatalogUrl: "http://catalog-api:8081"
      Grpc__MerchantsUrl: "http://merchants-api:8081"
      # Responders simulados de pago/courier/entrega (Fase 5; se apagan cuando lleguen Payments/Dispatch reales).
      Orders__EnableSimulatedResponders: "true"
      # Log de MassTransit en Debug para el stack dev: muestra el movimiento de mensajes (SEND/RECEIVE/Consume),
      # clave para diagnosticar la saga. (appsettings.Development.json esta gitignored, por eso se fija aqui.)
      Logging__LogLevel__MassTransit: "Debug"
    ports:
      - "5005:8080" # REST
      - "5015:8081" # HTTP/2 (gRPC interno futuro)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
      catalog-api:
        condition: service_started
      pricing-api:
        condition: service_started
    networks:
      - rappix-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  seq_data:
  minio_data:

networks:
  rappix-net:
    driver: bridge
    name: rappix-net
